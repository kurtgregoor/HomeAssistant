blueprint:
  name: Marstek tijdslotprogrammatie
  description: >
    Ondersteunt een instelbare grens voor de actuele netafname met twee
    Marstek-batterijen in Auto. Tijdens gemeten autoladen vanaf 1000 W krijgt
    Passive 0 W voorrang. In elk dal- en superdalvenster laadt de regeling één
    batterij tegelijk richting 100%. Gemeten zonneoverschot krijgt voorrang.
    Gebruik deze blueprint in plaats van eerdere Marstek-automatiseringen.
    Vereist Marstek by Diggit v0.1.14 of nieuwer.
  domain: automation
  homeassistant:
    min_version: "2025.7.0"
  input:
    charger_power:
      name: Actueel laadvermogen (W)
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: power
    grid_power:
      name: HomeWizard P1 netvermogen (W)
      description: Kies het totale netvermogen met positieve waarden bij afname.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: power
    grid_limit:
      name: Maximale netafname
      selector:
        number:
          min: 0.5
          max: 25
          step: 0.1
          mode: box
          unit_of_measurement: kW
    discharge_limit:
      name: Maximaal ontlaadvermogen per batterij
      default: 1000
      selector:
        number:
          min: 100
          max: 2500
          step: 50
          mode: box
          unit_of_measurement: W
    charge_limit:
      name: Maximaal laadvermogen in dal en superdal
      default: 1000
      selector:
        number:
          min: 100
          max: 2500
          step: 50
          mode: box
          unit_of_measurement: W
    planning_state:
      name: Tekst-helper voor de planning
      description: Deze helper bewaart het tariefblok en het einde van de actieve controle.
      selector:
        entity:
          filter:
            - domain: input_text
    first_battery:
      name: Eerste Marstek-batterij
      selector:
        config_entry:
          integration: marstek_diggit
    second_battery:
      name: Tweede Marstek-batterij
      selector:
        config_entry:
          integration: marstek_diggit

trigger_variables:
  charger_entity: !input charger_power
  grid_entity: !input grid_power
  grid_limit_kw: !input grid_limit

variables:
  charger_entity: !input charger_power
  grid_entity: !input grid_power
  grid_limit_kw: !input grid_limit
  first_battery_id: !input first_battery
  second_battery_id: !input second_battery
  battery_limit_w: !input discharge_limit
  charge_limit_w: !input charge_limit
  planning_helper: !input planning_state

triggers:
  - trigger: template
    id: charging_started
    value_template: "{{ states(charger_entity) | float(0) >= 1000 }}"
  - trigger: template
    id: charging_stopped
    value_template: "{{ is_number(states(charger_entity)) and states(charger_entity) | float < 1000 }}"
  - trigger: template
    id: peak
    value_template: "{{ states(grid_entity) | float(0) > grid_limit_kw | float * 1000 }}"
  - trigger: template
    id: headroom
    value_template: >
      {{ is_number(states(grid_entity))
         and states(grid_entity) | float <= grid_limit_kw | float * 1000 - 300 }}
  - trigger: time_pattern
    id: periodic
    seconds: "/30"
  - trigger: homeassistant
    id: startup
    event: start

conditions:
  - condition: template
    value_template: "{{ first_battery_id != second_battery_id }}"
  - condition: template
    value_template: >
      {% set charging = states(charger_entity) | float(0) >= 1000 %}
      {% set saved = states(planning_helper) | from_json(default={}) %}
      {% set active_until = saved.get('active_until', 0) | int if saved is mapping else 0 %}
      {% if charging %}
        {{ trigger.id in ['charging_started', 'startup']
           or (trigger.id == 'periodic' and trigger.now.second == 0
               and trigger.now.minute % 2 == 0) }}
      {% else %}
        {{ trigger.id != 'periodic' or trigger.now.second == 0
           or active_until > as_timestamp(now()) | int }}
      {% endif %}

actions:
  - variables:
      plan: "{{ states(planning_helper) | from_json(default={}) }}"
      check_minute: "{{ trigger.now.minute if trigger.id == 'periodic' else now().minute }}"
      check_second: "{{ trigger.now.second if trigger.id == 'periodic' else now().second }}"
      now_epoch: "{{ as_timestamp(now()) | int }}"
  - condition: template
    value_template: "{{ has_value(planning_helper) and plan is mapping }}"
  - condition: template
    value_template: >
      {{ is_number(states(charger_entity))
         and state_attr(charger_entity, 'unit_of_measurement') == 'W' }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ states(charger_entity) | float(0) >= 1000 }}"
        sequence:
          - parallel:
              - action: marstek_diggit.set_passive
                data:
                  source: energy_program
                  config_entry_id: !input first_battery
                  power: 0
                  duration_seconds: 180
              - action: marstek_diggit.set_passive
                data:
                  source: energy_program
                  config_entry_id: !input second_battery
                  power: 0
                  duration_seconds: 180
    default:
      - condition: template
        value_template: >
          {{ is_number(states(grid_entity))
             and state_attr(grid_entity, 'unit_of_measurement') == 'W' }}
      - action: marstek_diggit.get_tariffs
        response_variable: tariffs
      - variables:
          current_slot: >
            {% set current = now() %}
            {% set minute = current.hour * 60 + current.minute %}
            {% set today = 'weekday' if current.weekday() < 5 else 'weekend' %}
            {% set yesterday = 'weekday' if current.weekday() in [1, 2, 3, 4, 5] else 'weekend' %}
            {% set slot = namespace(end=0, kind='') %}
            {% for profile, is_today in [(today, true), (yesterday, false)] %}
              {% for kind in ['peak', 'offpeak', 'super_offpeak'] %}
                {% for block in tariffs.schedule[profile][kind] %}
                  {% set start = block[0:2] | int * 60 + block[3:5] | int %}
                  {% set end = block[6:8] | int * 60 + block[9:11] | int %}
                  {% if is_today and start < end and start <= minute < end %}
                    {% set slot.kind, slot.end = kind, end %}
                  {% elif is_today and start > end and minute >= start %}
                    {% set slot.kind, slot.end = kind, 1440 + end %}
                  {% elif not is_today and start > end and minute < end %}
                    {% set slot.kind, slot.end = kind, end %}
                  {% endif %}
                {% endfor %}
              {% endfor %}
            {% endfor %}
            {{- {'kind': slot.kind, 'end': slot.end} }}
      - variables:
          slot_key: "{{ current_slot.kind ~ ':' ~ current_slot.end }}"
          charge_slot_end: "{{ current_slot.end if current_slot.kind in ['offpeak', 'super_offpeak'] else 0 }}"
          slot_changed: "{{ plan.get('slot', '') != slot_key }}"
      - if:
          - condition: template
            value_template: "{{ slot_changed }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: !input planning_state
            data:
              value: "{{ {'slot': slot_key, 'active_until': plan.get('active_until', 0)} | to_json }}"
      - condition: template
        value_template: >
          {{ (charge_slot_end | int > 0
              or states(grid_entity) | float(0) > grid_limit_kw | float * 1000
              or plan.get('active_until', 0) | int > now_epoch | int)
             and (slot_changed or trigger.id != 'periodic'
                  or (charge_slot_end | int > 0
                      and check_minute | int % 30 == 0 and check_second | int == 0)
                  or plan.get('active_until', 0) | int > now_epoch | int) }}
      - action: marstek_diggit.get_status
        data:
          config_entry_id: !input first_battery
        response_variable: first_status
      - action: marstek_diggit.get_status
        data:
          config_entry_id: !input second_battery
        response_variable: second_status
      - condition: template
        value_template: >
          {{ (first_status.get('mode') == 'Auto' or first_status.get('passive_source') == 'energy_program')
             and (second_status.get('mode') == 'Auto' or second_status.get('passive_source') == 'energy_program')
             and is_number(first_status.get('ongrid_power'))
             and is_number(second_status.get('ongrid_power')) }}
      - variables:
          grid_w: "{{ states(grid_entity) | float }}"
          limit_w: "{{ grid_limit_kw | float * 1000 }}"
          first_charging: "{{ first_status.get('passive_power') | float(0) < 0 }}"
          second_charging: "{{ second_status.get('passive_power') | float(0) < 0 }}"
          demand_without_batteries_w: >
            {{ grid_w | float + first_status.ongrid_power | float + second_status.ongrid_power | float }}
      - condition: template
        value_template: >
          {{ is_number(states(charger_entity))
             and states(charger_entity) | float(0) < 1000
             and state_attr(charger_entity, 'unit_of_measurement') == 'W'
             and is_number(states(grid_entity))
             and state_attr(grid_entity, 'unit_of_measurement') == 'W' }}
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ grid_w | float > limit_w | float
                     and not (charge_slot_end | int > 0 and (first_charging or second_charging)) }}
            sequence:
              - variables:
                  watts_per_battery: >
                    {% set requested_w = (demand_without_batteries_w | float - limit_w | float) / 2 %}
                    {{ [battery_limit_w | int, requested_w | round(0, 'ceil') | int] | min }}
              - condition: template
                value_template: "{{ watts_per_battery | int > 0 }}"
              - action: input_text.set_value
                target:
                  entity_id: !input planning_state
                data:
                  value: "{{ {'slot': slot_key, 'active_until': (as_timestamp(now()) | int) + 120} | to_json }}"
              - parallel:
                  - action: marstek_diggit.set_passive
                    data:
                      source: energy_program
                      config_entry_id: !input first_battery
                      power: "{{ watts_per_battery }}"
                      duration_seconds: 60
                  - action: marstek_diggit.set_passive
                    data:
                      source: energy_program
                      config_entry_id: !input second_battery
                      power: "{{ watts_per_battery }}"
                      duration_seconds: 60
        default:
          - condition: template
            value_template: >
              {% set t = now() %}
              {{ charge_slot_end | int * 60 - (t.hour * 3600 + t.minute * 60 + t.second) >= 90 }}
          - condition: template
            value_template: >
              {{ is_number(first_status.get('bat_soc')) and is_number(second_status.get('bat_soc'))
                 and 0 <= first_status.bat_soc | float <= 100
                 and 0 <= second_status.bat_soc | float <= 100
                 and [first_status.bat_soc | float, second_status.bat_soc | float] | min < 100 }}
          - variables:
              charge_first: >
                {% set first = first_status.bat_soc | float %}
                {% set second = second_status.bat_soc | float %}
                {{ first < 100 and (second >= 100 or first_charging or (not second_charging and first <= second)) }}
              selected_output_w: >
                {{ (first_status.ongrid_power if charge_first else second_status.ongrid_power) | float }}
              available_w: "{{ limit_w | float - (demand_without_batteries_w | float) - 200 }}"
              solar_surplus_w: "{{ -(demand_without_batteries_w | float) - 200 }}"
              charge_w: >
                {% set budget = [available_w | float, solar_surplus_w | float] | min
                   if solar_surplus_w | float >= 100 else available_w | float %}
                {{ [charge_limit_w | int, (budget // 50) | int * 50] | min }}
          - condition: template
            value_template: "{{ charge_w | int >= 100 }}"
          - action: input_text.set_value
            target:
              entity_id: !input planning_state
            data:
              value: "{{ {'slot': slot_key, 'active_until': (as_timestamp(now()) | int) + 120} | to_json }}"
          - alias: Zet de andere batterij stil
            action: marstek_diggit.set_passive
            data:
              source: energy_program
              config_entry_id: "{{ second_battery_id if charge_first else first_battery_id }}"
              power: 0
              duration_seconds: 90
          - condition: template
            value_template: >
              {{ is_number(states(charger_entity))
                 and states(charger_entity) | float(0) < 1000
                 and state_attr(charger_entity, 'unit_of_measurement') == 'W'
                 and is_number(states(grid_entity))
                 and state_attr(grid_entity, 'unit_of_measurement') == 'W' }}
          - condition: template
            value_template: >
              {% set t = now() %}
              {{ charge_slot_end | int * 60 - (t.hour * 3600 + t.minute * 60 + t.second) >= 65 }}
          - variables:
              final_charge_w: >
                {% set live_budget = (limit_w | float - states(grid_entity) | float - selected_output_w | float - 200) // 50 * 50 %}
                {{ [charge_w | int, live_budget | int] | min }}
          - condition: template
            value_template: "{{ final_charge_w | int >= 100 }}"
          - alias: Laad de batterij met de laagste SoC
            action: marstek_diggit.set_passive
            data:
              source: energy_program
              config_entry_id: "{{ first_battery_id if charge_first else second_battery_id }}"
              power: "{{ -(final_charge_w | int) }}"
              duration_seconds: 60

mode: queued
max: 4
max_exceeded: silent
